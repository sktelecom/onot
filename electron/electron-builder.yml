appId: dev.onot.desktop
productName: onot
directories:
  output: dist-electron
  buildResources: build
files:
  - main.mjs
  - preload.mjs
  - lib/**/*
  - package.json
# Bundle the static frontend build + frozen sidecar as resources
extraResources:
  - from: ../frontend/dist
    to: frontend
  - from: ../dist/onot-sidecar
    to: sidecar/onot-sidecar
# Initially unsigned (D: code-signing certificate subject undecided). Add mac.notarize / win.certificate for official releases.
# On a tag push, release.yml uploads the artifacts to GitHub Releases with --publish always.
publish:
  provider: github
  owner: sktelecom
  repo: onot
mac:
  target: dmg
  category: public.app-category.developer-tools
  identity: null
win:
  target: nsis
linux:
  target: AppImage
