[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onot"
version = "1.1.0.dev0"
description = "Generate open source software notices from SBOM/SPDX documents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "onot contributors" }]
maintainers = [
    { name = "Hyunmin Han" },
    { name = "Haksung Jang" },
]
keywords = [
    "sbom",
    "spdx",
    "cyclonedx",
    "oss",
    "open-source",
    "license",
    "compliance",
    "notice",
    "attribution",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic[email]>=2.6",
    "pydantic-settings>=2.2",
    "license-expression>=30",
    "httpx>=0.27",
    "platformdirs>=4",
    "jinja2>=3.1",
    "pyyaml>=6",
    "typer>=0.12",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
spdx = ["spdx-tools>=0.8"]
cyclonedx = ["cyclonedx-python-lib>=7"]
excel = ["openpyxl>=3.1"]
api = ["fastapi>=0.136.3", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
pdf = ["weasyprint>=61"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "respx>=0.21",
]
all = [
    "onot[spdx,cyclonedx,excel,api]",
]

[project.urls]
Homepage = "https://github.com/sktelecom/onot"
Repository = "https://github.com/sktelecom/onot"
Issues = "https://github.com/sktelecom/onot/issues"
Changelog = "https://github.com/sktelecom/onot/blob/main/CHANGELOG.md"

[project.scripts]
onot = "onot.cli.main:app"
onot-sidecar = "onot.api.serve:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["onot*"]

[tool.setuptools.package-data]
onot = ["license/data/**/*", "rendering/templates/**/*", "rendering/themes/**/*", "rendering/i18n/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "PTH"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"src/onot/cli/*" = ["B008"]  # Typer는 기본값에 Option() 호출이 공식 패턴
"src/onot/api/*" = ["B008"]  # FastAPI는 기본값에 File()/Form() 호출이 공식 패턴

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["onot"]
branch = true
