[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onot"
version = "2.0.0.dev0"
description = "Generate open source software notices from SBOM/SPDX documents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "onot contributors" }]
dependencies = [
    "pydantic[email]>=2.6",
    "pydantic-settings>=2.2",
    "license-expression>=30",
    "httpx>=0.27",
    "platformdirs>=4",
    "jinja2>=3.1",
    "pyyaml>=6",
    "typer>=0.12",
]

[project.optional-dependencies]
spdx = ["spdx-tools>=0.8"]
cyclonedx = ["cyclonedx-python-lib>=7"]
excel = ["openpyxl>=3.1"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
pdf = ["weasyprint>=61"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "respx>=0.21",
]
all = [
    "onot[spdx,cyclonedx,excel,api]",
]

[project.scripts]
onot = "onot.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["onot*"]

[tool.setuptools.package-data]
onot = ["license/data/**/*", "rendering/templates/**/*", "rendering/themes/**/*", "rendering/i18n/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "PTH"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"src/onot/cli/*" = ["B008"]  # Typer는 기본값에 Option() 호출이 공식 패턴

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["onot"]
branch = true
