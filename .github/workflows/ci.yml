name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: English-only guard (no Hangul in tracked files)
        run: python scripts/check_no_hangul.py
      - name: Changelog has an entry for the current version
        run: python scripts/check_changelog.py
      - run: pip install ruff==0.15.15
      - run: ruff check src tests
      - run: ruff format --check src tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[spdx,cyclonedx,excel,api,pdf,dev]"
      - run: mypy

  test-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[spdx,cyclonedx,excel,api,dev]"
      # Must pass without a network (respx mock + bundled catalog)
      - run: pytest --cov=onot --cov-report=xml --cov-fail-under=90

  test-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install WeasyPrint native deps
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libffi-dev
      - run: pip install -e ".[spdx,cyclonedx,excel,api,pdf,dev]"
      - run: pytest tests/rendering/test_renderers.py -k pdf

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm -C frontend install --frozen-lockfile
      - run: pnpm -C frontend build
      - run: pnpm -C frontend test

  build-desktop:
    needs: [lint, test-core, frontend]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
      - run: pip install -e ".[spdx,cyclonedx,excel,api]" pyinstaller==6.20.0
      - run: pnpm -C frontend install --frozen-lockfile && pnpm -C frontend build
      - name: build frozen sidecar
        shell: bash
        run: bash electron/build-sidecar.sh
      - run: pnpm -C electron install
      # Initially unsigned (D-016). Add signing/notarization secrets for official releases.
      # cwd is electron/, so the config path is relative to that directory.
      # This job is for build verification only — pin it with --publish never so that
      # the publish setting in electron-builder.yml does not attempt to publish on CI
      # (push) and require GH_TOKEN. Actual publishing is handled only by release.yml
      # (--publish always), which has GH_TOKEN.
      - run: pnpm -C electron exec electron-builder --config electron-builder.yml --publish never
      - name: Verify exactly one installer was produced
        # electron-builder writes the local file with spaces ("onot Setup x.y.z.exe") and only
        # sanitizes to the documented "onot-Setup-x.y.z.exe" when publishing to GitHub Releases,
        # so the documented-name check lives in release.yml (against the published assets).
        shell: bash
        run: |
          cd electron/dist-electron
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "Windows installers:"; ls -1 *.exe || true
            n=$(ls -1 *Setup*.exe 2>/dev/null | wc -l | tr -d ' ')
            [ "$n" = "1" ] || { echo "expected exactly one *Setup*.exe, found $n"; exit 1; }
          else
            echo "macOS disk images:"; ls -1 *.dmg || true
            ls -1 *.dmg >/dev/null 2>&1 || { echo "expected a .dmg"; exit 1; }
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: onot-${{ matrix.os }}
          path: electron/dist-electron/

  e2e-desktop:
    needs: [build-desktop]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
      - run: pip install -e ".[spdx,cyclonedx,excel,api]"
      - run: pnpm -C frontend install --frozen-lockfile && pnpm -C frontend build
      - run: pnpm -C electron install
      # Playwright-electron (_electron) uses the bundled Electron, so no separate chromium install is needed.
      - name: sidecar lifecycle + Playwright-electron E2E
        shell: bash
        env:
          ONOT_SIDECAR_PYTHON: python
          VITE_DEV_SERVER: http://localhost:4173
        run: |
          # The dev-mode E2E serves the static frontend (build output) via vite preview
          pnpm -C frontend exec vite preview --port 4173 --strictPort &
          for i in $(seq 1 30); do curl -sf http://localhost:4173 >/dev/null && break; sleep 1; done
          node --test electron/test/*.test.mjs
          pnpm -C electron run e2e
