name: scorecard

# OpenSSF Scorecard — measures supply-chain security best-practice scores and exposes
# them via code scanning (Security tab) and a public badge (api.securityscorecards.dev).
on:
  branch_protection_rule:
  schedule:
    - cron: "0 3 * * 1" # Every Monday 03:00 UTC
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Upload SARIF to code scanning
      id-token: write # Publish results for the public badge (OIDC)
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
