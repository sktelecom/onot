name: release

# v* 태그를 밀면 윈도우/macOS 설치 파일을 빌드해 GitHub Releases에 게시하고,
# 최종 릴리스 태그(하이픈 없는 v1.2.3)는 PyPI에도 게시한다.
# 예: git tag v1.1.0 && git push origin v1.1.0
#
# PyPI 게시는 토큰 없는 Trusted Publishing(OIDC)을 쓴다. 최초 1회 PyPI에서
# 신뢰 게시자를 등록해야 한다(Owner: sktelecom, Repo: onot, Workflow: release.yml,
# Environment: pypi). 등록 전까지 publish-pypi 잡은 실패하지만 일반 CI에는 영향이 없다.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish-desktop:
    permissions:
      contents: write # GitHub Releases에 설치파일 업로드
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: pip install -e ".[spdx,cyclonedx,excel,api]" pyinstaller
      - run: pnpm -C frontend install --frozen-lockfile && pnpm -C frontend build
      - name: build frozen sidecar
        shell: bash
        run: bash electron/build-sidecar.sh
      - run: pnpm -C electron install
      # 미서명(D-016). electron-builder는 기본적으로 git 태그가 아닌 package.json 버전으로
      # 릴리스를 만들므로, 푼 태그에서 버전을 뽑아 extraMetadata.version으로 주입해 릴리스
      # 태그·파일명을 일치시킨다. 태그에 '-'가 있으면(rc/beta 등) prerelease로, 없으면 바로
      # 공개되는 release로 게시한다.
      - name: build & publish to GitHub Releases
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *-* ]]; then RELEASE_TYPE=prerelease; else RELEASE_TYPE=release; fi
          echo "tag=$GITHUB_REF_NAME version=$VERSION releaseType=$RELEASE_TYPE"
          pnpm -C electron exec electron-builder --config electron-builder.yml \
            -c.extraMetadata.version="$VERSION" \
            -c.publish.releaseType="$RELEASE_TYPE" \
            --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    # 최종 릴리스 태그만 게시한다(rc/beta 등 하이픈 포함 태그는 데스크톱만).
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      id-token: write # OIDC Trusted Publishing
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/project/onot/
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Pin package version to the git tag
        # 태그를 단일 진실로 삼아 sdist/wheel 버전을 일치시킨다(pyproject의 .dev0 무시).
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building onot $VERSION from tag $GITHUB_REF_NAME"
          sed -i -E "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-sbom:
    name: Attach SBOM to release
    needs: publish-desktop # 릴리스가 생성된 뒤 자산을 첨부한다
    runs-on: ubuntu-latest
    permissions:
      contents: write # 릴리스에 자산 업로드
    steps:
      - uses: actions/checkout@v6
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: onot-${{ github.ref_name }}-sbom.cdx.json
      - name: Attach SBOM to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "onot-${{ github.ref_name }}-sbom.cdx.json" --clobber
