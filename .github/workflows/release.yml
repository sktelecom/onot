name: release

# Pushing a v* tag builds the Windows/macOS installers and publishes them to GitHub
# Releases, and final release tags (v1.2.3 without a hyphen) are also published to PyPI.
# Example: git tag v1.1.0 && git push origin v1.1.0
#
# PyPI publishing uses token-less Trusted Publishing (OIDC). The trusted publisher must
# be registered once on PyPI (Owner: sktelecom, Repo: onot, Workflow: release.yml,
# Environment: pypi). Until registration, the publish-pypi job fails, but this does not
# affect regular CI.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish-desktop:
    permissions:
      contents: write # Upload installers to GitHub Releases
    strategy:
      fail-fast: false
      # Serialize the OS legs: both run `electron-builder --publish always`, and publishing
      # concurrently let each leg create its own GitHub release for the same tag (a race that
      # split the v1.1.2 assets across two releases). max-parallel: 1 makes the second leg find
      # and upload to the release the first leg already created.
      max-parallel: 1
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 20
      - run: pip install -e ".[spdx,cyclonedx,excel,api]" pyinstaller==6.20.0
      - run: pnpm -C frontend install --frozen-lockfile && pnpm -C frontend build
      - name: build frozen sidecar
        shell: bash
        run: bash electron/build-sidecar.sh
      - run: pnpm -C electron install
      # Unsigned (D-016). By default electron-builder creates a release from the
      # package.json version rather than the git tag, so the version is extracted from
      # the pushed tag and injected via extraMetadata.version to align the release tag
      # and filenames. If the tag contains '-' (rc/beta, etc.) it is published as a
      # prerelease; otherwise it is published as a public release.
      - name: build & publish to GitHub Releases
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *-* ]]; then RELEASE_TYPE=prerelease; else RELEASE_TYPE=release; fi
          echo "tag=$GITHUB_REF_NAME version=$VERSION releaseType=$RELEASE_TYPE"
          pnpm -C electron exec electron-builder --config electron-builder.yml \
            -c.extraMetadata.version="$VERSION" \
            -c.publish.releaseType="$RELEASE_TYPE" \
            --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    # Publish only final release tags (hyphenated tags like rc/beta are desktop-only).
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      id-token: write # OIDC Trusted Publishing
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/project/onot/
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Pin package version to the git tag
        # Treat the tag as the single source of truth to align sdist/wheel versions (ignore pyproject's .dev0).
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building onot $VERSION from tag $GITHUB_REF_NAME"
          sed -i -E "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
      - name: Build sdist and wheel
        run: |
          python -m pip install build==1.5.0
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          attestations: true # Attach PEP 740 provenance

  publish-sbom:
    name: Attach SBOM to release
    needs: publish-desktop # Attach assets after the release is created
    runs-on: ubuntu-latest
    permissions:
      contents: write # Upload assets to the release
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: onot-${{ github.ref_name }}-sbom.cdx.json
      - name: Attach SBOM to the release
        # Avoid injection by taking github.ref_name from the built-in env instead of interpolating it directly into the shell.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "onot-${GITHUB_REF_NAME}-sbom.cdx.json" --clobber
      - name: Verify published installer names match the docs
        # Users download these exact asset names; the docs promise onot-Setup-x.y.z.exe and a .dmg.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          names=$(gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name')
          echo "$names"
          echo "$names" | grep -Eq '^onot-Setup-[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?\.exe$' \
            || { echo "missing a published onot-Setup-x.y.z.exe asset"; exit 1; }
          echo "$names" | grep -Eq '\.dmg$' || { echo "missing a published .dmg asset"; exit 1; }
